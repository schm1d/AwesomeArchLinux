# Managed by AwesomeArchLinux.
# Host/workstation network policy. This assumes the machine is not a router.
# Source: https://docs.kernel.org/networking/ip-sysctl.html

# Do not route packets or emit/accept IPv4 redirects and source-routed traffic.
net.ipv4.ip_forward = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Loose reverse-path filtering rejects unroutable spoofed sources without
# breaking common VPN and asymmetric-routing setups. Strict mode overrides this.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_all = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1

# Keep IPv6 enabled and SLAAC functional while rejecting redirects and all
# source-routing headers. Explicitly setting disable_ipv6 = 0 ensures switching
# away from --disable-ipv6 restores IPv6 immediately without a reboot.
# For IPv6, -1 (not 0) disables every routing header.
net.ipv6.conf.all.disable_ipv6 = 0
net.ipv6.conf.default.disable_ipv6 = 0
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = -1
net.ipv6.conf.default.accept_source_route = -1
# Unlike IPv4, IPv6 does not copy conf/default to interfaces that already
# exist, and redirects are checked against the per-interface value only.
# The globs set live interfaces when this file is applied without a reboot.
net.ipv6.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_source_route = -1
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
