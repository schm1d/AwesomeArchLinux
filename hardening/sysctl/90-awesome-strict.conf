# Managed by AwesomeArchLinux.
# Compatibility-breaking strict overlay. Do not apply this profile blindly to
# desktop, container, developer, kexec/crash-kernel, or io_uring workloads.

# Disable unprivileged namespaces and all new io_uring instances.
-kernel.unprivileged_userns_clone = 0
-kernel.io_uring_disabled = 2

# These two values are one-way transitions until reboot.
-kernel.unprivileged_bpf_disabled = 1
-kernel.kexec_load_disabled = 1

# Restrict diagnostics and debugging more aggressively than the core profile.
kernel.kptr_restrict = 2
-kernel.yama.ptrace_scope = 2
-kernel.perf_event_paranoid = 3
kernel.sysrq = 0

# Convert a kernel oops into a reboot rather than continuing in a potentially
# corrupted state. This is an availability tradeoff, not a free hardening win.
kernel.panic_on_oops = 1
kernel.panic = 10

# Strict reverse-path filtering can break asymmetric routing and some VPNs.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
