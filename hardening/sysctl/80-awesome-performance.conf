# Managed by AwesomeArchLinux.
# Small, measurable network performance overlay. This intentionally avoids
# workload-specific socket-buffer, dirty-memory, keepalive, and timeout values.
# Sources: https://docs.kernel.org/networking/ip-sysctl.html
#          https://research.google/pubs/bbr-congestion-based-congestion-control/

# fq provides per-flow pacing; BBR is loaded by 80-awesome-bbr.modules.
-net.core.default_qdisc = fq
-net.ipv4.tcp_congestion_control = bbr

# Probe only after path-MTU black-hole detection; do not force probing globally.
net.ipv4.tcp_mtu_probing = 1
