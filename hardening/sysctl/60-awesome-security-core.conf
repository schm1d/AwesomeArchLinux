# Managed by AwesomeArchLinux.
# Compatibility-oriented security controls shared by every profile.

# Reduce kernel attack surface exposed to unprivileged processes.
-dev.tty.ldisc_autoload = 0
-vm.unprivileged_userfaultfd = 0
-kernel.unprivileged_bpf_disabled = 2
-net.core.bpf_jit_harden = 2

# Filesystem and core-dump protections.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# ASLR and low-address protections. The entropy keys are architecture-specific,
# so a leading '-' makes unsupported values non-fatal under systemd-sysctl.
kernel.randomize_va_space = 2
vm.mmap_min_addr = 65536
-vm.mmap_rnd_bits = 32
-vm.mmap_rnd_compat_bits = 16

# Limit common kernel information-leak and tracing interfaces without disabling
# normal same-user debugging. The strict profile tightens these further.
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 1
-kernel.yama.ptrace_scope = 1
-kernel.perf_event_paranoid = 2
