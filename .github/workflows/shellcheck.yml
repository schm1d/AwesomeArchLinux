name: ShellCheck

on:
  # '**.rules': tests/test_chroot_security.sh validates utils/auditd-attack.rules.
  push:
    branches: [main]
    paths: ['**.sh', '**.rules', '.shellcheckrc', '.github/workflows/shellcheck.yml']
  pull_request:
    branches: [main]
    paths: ['**.sh', '**.rules', '.shellcheckrc', '.github/workflows/shellcheck.yml']

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gdisk (sgdisk), uuid-runtime (uuidgen), openssl, tzdata and acl are
      # used by the test fixtures; linux-libc-dev provides the kernel syscall
      # tables (asm/unistd_64.h, unistd_32.h) the audit-rule test checks
      # syscall names against. A test that would skip for a missing tool
      # fails in CI instead (see skips_are_failures in tests/lib.sh).
      - name: Install ShellCheck and test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck gdisk acl uuid-runtime openssl tzdata linux-libc-dev

      - name: Find and lint all shell scripts
        shell: bash
        run: |
          echo "::group::Scripts found"
          find . -name '*.sh' -type f | sort
          echo "::endgroup::"

          FAILED=0
          while IFS= read -r script; do
            echo "::group::Checking $script"
            if shellcheck --severity=warning --shell=bash "$script"; then
              echo "PASS: $script"
            else
              echo "::error file=$script::ShellCheck found issues"
              FAILED=1
            fi
            echo "::endgroup::"
          done < <(find . -name '*.sh' -type f | sort)

          if [[ "$FAILED" -eq 1 ]]; then
            echo "::error::ShellCheck found issues in one or more scripts"
            exit 1
          fi

          echo "All scripts passed ShellCheck."

      - name: Run pure-Bash regression test suite
        shell: bash
        env:
          TESTS_NO_SKIP: "1"
        run: ./tests/run-tests.sh
